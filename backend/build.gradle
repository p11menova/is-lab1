plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'war'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}
spotless {
    java {
        googleJavaFormat('1.23.0').aosp().reflowLongStrings()
        target 'src/**/*.java'
        replaceRegex('Remove all comments',
                // Регулярное выражение для захвата всех Java-комментариев
                '((//.*)|(/\\*([\\s\\S]*?)\\*/))',
                ''
        )

        // Можно добавить удаление лишних пустых строк после удаления комментариев
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'

    implementation 'org.hibernate:hibernate-core:6.4.4.Final'

    implementation 'org.postgresql:postgresql:42.7.3'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.16.1'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.5.1'


    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

war {
    archiveFileName = "${project.name}.war"
    from 'src/main/webapp'
}


tasks.register('deployWar', Copy) {
    description = 'Deletes old WARs and deploys the new one to WildFly.'
    group = 'deployment'

    dependsOn 'war'
    onlyIf { project.hasProperty('wildfly.deployment.dir') }

    doFirst {
        def deploymentDir = file(project.property('wildfly.deployment.dir'))

        def warNamePrefix = war.archiveBaseName.get()

        println "Searching for files with prefix '${warNamePrefix}' in '${deploymentDir}' to delete..."

        deploymentDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name.startsWith(warNamePrefix)) {
                println "Deleting old deployment file: ${file.path}"
                file.delete()
            }
        }
    }
    from war
    into project.property('wildfly.deployment.dir')

    doLast {
        println "Successfully copied ${war.archiveFileName.get()} to ${project.property('wildfly.deployment.dir')}"
    }
}
test {
    useJUnitPlatform()
}

// Отключаем spotless из процесса сборки, оставляем только для задачи format
tasks.named('spotlessJava').configure {
    enabled = false
}


tasks.register('deployRemote', Exec) {
    description = 'Deploys WAR to remote server via SCP'
    group = 'deployment'
    
    dependsOn 'war'
    
    doFirst {
        def warFile = war.archiveFile.get().asFile
        def remoteHost = project.findProperty('remote.host') ?: 'se.ifmo.ru'
        def remoteUser = project.findProperty('remote.user') ?: 's409342'
        def remotePort = project.findProperty('remote.port') ?: '2222'
        def remotePath = project.findProperty('remote.path') ?: '~/wildfly-34.0.0.Final/standalone/deployments'
        
        def remoteTarget = "${remoteUser}@${remoteHost}:${remotePath}"
        
        println "Deploying ${warFile.name} to ${remoteTarget}..."
        
        commandLine 'scp', '-P', remotePort, '-o', 'StrictHostKeyChecking=no', warFile.absolutePath, remoteTarget
    }
    
    doLast {
        println "Successfully deployed!"
    }
}



tasks.register('format') {
    group = 'formatting'
    description = 'Форматирование кода Spotless'
    dependsOn 'spotlessApply'
}
