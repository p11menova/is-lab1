services:
  postgres:
    image: postgres:15-alpine
    container_name: is-lab1-postgres
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Функции БД будут созданы через Hibernate при первом запуске
      # - ./backend/src/main/resources/db_functions_creation.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - is-lab1-network

  minio:
    image: minio/minio:latest
    container_name: is-lab1-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - is-lab1-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: is-lab1-backend
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: studs
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: import-files
      JAVA_OPTS: "-Xms256m -Xmx1024m -XX:MetaspaceSize=256M -XX:MaxMetaspaceSize=1024m"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - is-lab1-network
    volumes:
      - ./backend/build/libs/is_lab1.war:/opt/jboss/wildfly/standalone/deployments/is_lab1.war

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: is-lab1-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=http://localhost:8080/is_lab1
    depends_on:
      - backend
    networks:
      - is-lab1-network

networks:
  is-lab1-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

